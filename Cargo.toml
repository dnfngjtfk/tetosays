[package]
name = "tetosays"
version = "0.4.1"
edition = "2021"
description = "A cowsay clone with Kasane Teto ASCII art and speech bubbles."
license = "MIT"
repository = "https://github.com/dnfngjtfk/tetosays"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
terminal_size = "0.4"

[profile.release]
strip = true
lto = true
