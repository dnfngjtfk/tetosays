name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.4.1
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/tetosays.exe -DestinationPath tetosays-${{ inputs.tag }}-windows-x86_64.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: "*.zip"
